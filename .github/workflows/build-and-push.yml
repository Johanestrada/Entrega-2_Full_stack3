name: Build and push Docker images

on:
  push:
    branches: [ main, 'deploy/*', 'deploy/**', deploy/aws ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Prepare image tags
        id: meta
        shell: bash
        run: |
          echo "repo_slug=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "branch_tag=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push eureka-server
        uses: docker/build-push-action@v4
        with:
          context: ./eureka-server
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_slug }}-eureka-server:${{ steps.meta.outputs.branch_tag }}
            ghcr.io/${{ steps.meta.outputs.repo_slug }}-eureka-server:${{ steps.meta.outputs.sha_tag }}
            ghcr.io/${{ steps.meta.outputs.repo_slug }}-eureka-server:latest

      - name: Build and push estudiante-service
        uses: docker/build-push-action@v4
        with:
          context: ./estudiante-service
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_slug }}-estudiante-service:${{ steps.meta.outputs.branch_tag }}
            ghcr.io/${{ steps.meta.outputs.repo_slug }}-estudiante-service:${{ steps.meta.outputs.sha_tag }}
            ghcr.io/${{ steps.meta.outputs.repo_slug }}-estudiante-service:latest

      - name: Build and push asistencia-service
        uses: docker/build-push-action@v4
        with:
          context: ./asistencia-service
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_slug }}-asistencia-service:${{ steps.meta.outputs.branch_tag }}
            ghcr.io/${{ steps.meta.outputs.repo_slug }}-asistencia-service:${{ steps.meta.outputs.sha_tag }}
            ghcr.io/${{ steps.meta.outputs.repo_slug }}-asistencia-service:latest

      - name: Build and push evaluacion-service
        uses: docker/build-push-action@v4
        with:
          context: ./evaluacion-service
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_slug }}-evaluacion-service:${{ steps.meta.outputs.branch_tag }}
            ghcr.io/${{ steps.meta.outputs.repo_slug }}-evaluacion-service:${{ steps.meta.outputs.sha_tag }}
            ghcr.io/${{ steps.meta.outputs.repo_slug }}-evaluacion-service:latest

      - name: Build and push bff-service
        uses: docker/build-push-action@v4
        with:
          context: ./bff-service
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_slug }}-bff-service:${{ steps.meta.outputs.branch_tag }}
            ghcr.io/${{ steps.meta.outputs.repo_slug }}-bff-service:${{ steps.meta.outputs.sha_tag }}
            ghcr.io/${{ steps.meta.outputs.repo_slug }}-bff-service:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend-angular
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_slug }}-frontend:${{ steps.meta.outputs.branch_tag }}
            ghcr.io/${{ steps.meta.outputs.repo_slug }}-frontend:${{ steps.meta.outputs.sha_tag }}
            ghcr.io/${{ steps.meta.outputs.repo_slug }}-frontend:latest
