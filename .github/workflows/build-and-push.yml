name: Build and push Docker images

on:
  push:
    branches: [ main, 'deploy/*', 'deploy/**', deploy/aws ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push eureka-server
        uses: docker/build-push-action@v4
        with:
          context: ./eureka-server
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-eureka-server:${{ github.ref_name }},ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-eureka-server:latest

      - name: Build and push estudiante-service
        uses: docker/build-push-action@v4
        with:
          context: ./estudiante-service
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-estudiante-service:${{ github.ref_name }},ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-estudiante-service:latest

      - name: Build and push asistencia-service
        uses: docker/build-push-action@v4
        with:
          context: ./asistencia-service
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-asistencia-service:${{ github.ref_name }},ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-asistencia-service:latest

      - name: Build and push evaluacion-service
        uses: docker/build-push-action@v4
        with:
          context: ./evaluacion-service
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-evaluacion-service:${{ github.ref_name }},ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-evaluacion-service:latest

      - name: Build and push bff-service
        uses: docker/build-push-action@v4
        with:
          context: ./bff-service
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-bff-service:${{ github.ref_name }},ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-bff-service:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend-angular
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-frontend:${{ github.ref_name }},ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-frontend:latest
