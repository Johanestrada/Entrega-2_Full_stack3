spring.application.name=asistencia-service

server.port=8082


# Configuración MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
rabbitmq.exchange.eventos=eventos.exchange
rabbitmq.routing.asistencia.registrada=evento.asistencia.registrada

# Kafka bootstrap y producer
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.linger.ms=20
spring.kafka.producer.properties.batch.size=16384

# Kafka consumer
spring.kafka.consumer.group-id=colegio-asistencia-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.colegio.*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=50

# Tópico principal: asistencia.eventos
# Retención corta (24h) porque es un flujo operativo de alta frecuencia y no requiere análisis histórico profundo.
kafka.topic.asistencia.name=asistencia.eventos
kafka.topic.asistencia.partitions=3
kafka.topic.asistencia.replicas=3
kafka.topic.asistencia.retention.ms=86400000
kafka.topic.asistencia.cleanup.policy=delete
kafka.topic.asistencia.min.insync.replicas=2

# DLT para asistencia.eventos
# Se usa retención más corta para limpiar rápidamente mensajes fallidos sin acumular carga operacional.
kafka.topic.asistencia.dlt.name=asistencia.eventos.DLT
kafka.topic.asistencia.dlt.partitions=3
kafka.topic.asistencia.dlt.replicas=3
kafka.topic.asistencia.dlt.retention.ms=43200000
kafka.topic.asistencia.dlt.cleanup.policy=delete
kafka.topic.asistencia.dlt.min.insync.replicas=2