server.port=8081

spring.application.name=estudiante-service

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.jpa.hibernate.ddl-auto=update
# Configuraci\u00f3n MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}

# Kafka bootstrap y producer
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.linger.ms=20
spring.kafka.producer.properties.batch.size=16384

# Kafka consumer
# Grupo de notificaciones para estudiantes: consume los eventos de calificaciones y asistencia.
spring.kafka.consumer.group-id=estudiante-notificaciones
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.colegio.*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=50
spring.kafka.listener.concurrency=${kafka.consumer.concurrency:2}

# Grupos documentados de consumo para los mismos eventos.
# - estudiante-notificaciones: grupo principal para notificaciones y alertas de estudiantes.
# - analitica-academica: grupo independiente usado por analítica académica.
kafka.consumer.notifications.group-id=estudiante-notificaciones
kafka.consumer.analytics.group-id=analitica-academica
kafka.consumer.concurrency=2

# Tópicos del dominio de eventos que consume el servicio de estudiantes.
kafka.topic.estudiante.name=estudiantes.eventos
kafka.topic.estudiante.dlt.name=estudiantes.eventos.DLT
kafka.topic.calificaciones.name=calificaciones.eventos
kafka.topic.calificaciones.dlt.name=calificaciones.eventos.DLT
kafka.topic.asistencia.name=asistencia.eventos
kafka.topic.asistencia.dlt.name=asistencia.eventos.DLT