spring.application.name=evaluacion-service
server.port=8083
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Configuración MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}

spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
rabbitmq.exchange.eventos=eventos.exchange
rabbitmq.routing.evaluacion.calificada=evento.evaluacion.calificada

# Kafka bootstrap y producer
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.linger.ms=20
spring.kafka.producer.properties.batch.size=16384

# Kafka consumer
spring.kafka.consumer.group-id=colegio-evaluacion-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.colegio.*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=50

# Tópico principal: calificaciones.eventos
kafka.topic.calificaciones.name=calificaciones.eventos
kafka.topic.calificaciones.partitions=6
kafka.topic.calificaciones.replicas=3
kafka.topic.calificaciones.retention.ms=604800000
kafka.topic.calificaciones.cleanup.policy=delete
kafka.topic.calificaciones.min.insync.replicas=2

# DLT para calificaciones.eventos
kafka.topic.calificaciones.dlt.name=calificaciones.eventos.DLT
kafka.topic.calificaciones.dlt.partitions=3
kafka.topic.calificaciones.dlt.replicas=3
kafka.topic.calificaciones.dlt.retention.ms=86400000
kafka.topic.calificaciones.dlt.cleanup.policy=delete
kafka.topic.calificaciones.dlt.min.insync.replicas=2
