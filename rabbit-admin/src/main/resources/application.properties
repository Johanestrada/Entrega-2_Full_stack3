spring.application.name=rabbit-admin
server.port=8085

# RabbitMQ Configuration
spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESSES:rabbitmq-1:5672,rabbitmq-2:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:colegio_app}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:colegio_app}
spring.rabbitmq.virtual-host=/

# Listener Configuration
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=1

# RabbitMQ Exchanges
rabbitmq.exchange.eventos=eventos.exchange
rabbitmq.exchange.dlx=eventos.dlx

# RabbitMQ Queues
rabbitmq.queue.estudiante=eventos.estudiante
rabbitmq.queue.asistencia=eventos.asistencia
rabbitmq.queue.evaluacion=eventos.evaluacion

# RabbitMQ DLQs
rabbitmq.queue.dlq.estudiante=eventos.estudiante.dlq
rabbitmq.queue.dlq.asistencia=eventos.asistencia.dlq
rabbitmq.queue.dlq.evaluacion=eventos.evaluacion.dlq

# RabbitMQ Routing Keys
rabbitmq.routing.estudiante=evento.estudiante.*
rabbitmq.routing.asistencia=evento.asistencia.*
rabbitmq.routing.evaluacion=evento.evaluacion.*

# Dead-letter routing keys (exact matches for the direct DLX)
rabbitmq.routing.dlq.estudiante=dlq.estudiante
rabbitmq.routing.dlq.asistencia=dlq.asistencia
rabbitmq.routing.dlq.evaluacion=dlq.evaluacion

# RabbitMQ Specific Routing Keys
rabbitmq.routing.estudiante.creado=evento.estudiante.creado
rabbitmq.routing.asistencia.registrada=evento.asistencia.registrada
rabbitmq.routing.evaluacion.calificada=evento.evaluacion.calificada

# Logging
logging.level.root=INFO
logging.level.com.colegio=DEBUG
logging.level.org.springframework.amqp=DEBUG
